[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitforge"
version = "0.1.0"
description = "A complete circuit design, simulation and synthesis toolchain."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yannis Schmidt"},
]
keywords = ["circuit", "simulation", "EDA", "synthesis", "optimization", "thermal", "logic", "SPICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["cupy-cuda11x>=12.0"]
gui = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
circuitforge = "circuitforge.cli:main"
circuitforge-gui = "circuitforge.gui:run_gui"

[project.urls]
Homepage = "https://github.com/YannisSchmidt/CircuitForge"
Repository = "https://github.com/YannisSchmidt/CircuitForge"
Issues = "https://github.com/YannisSchmidt/CircuitForge/issues"

[tool.setuptools]
packages = ["circuitforge"]
include-package-data = true

[tool.setuptools.package-data]
circuitforge = ["py.typed"]
